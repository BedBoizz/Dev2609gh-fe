<!doctype html>
<html lang="vi">

        <meta charset="UTF-8" />

    <body>
        <div class="container">
            <h2>Giỏ hàng</h2>
            <div class="cart-layout">
                <!-- Danh sách sản phẩm -->

                <div class="cart-products">
                    <div id="cart-list">
                        <!-- JavaScript sẽ hiển thị sản phẩm ở đây -->
                    </div>
                </div>

                <!-- Tóm tắt đơn hàng -->
                <div class="cart-summary">
                    <h3>Tóm tắt đơn hàng</h3>

                    <div class="summary-row">
                        <span>Tổng thành tiền</span>
                        <span class="free">Free ship</span>
                    </div>

                    <p class="shipping-note">
                        (Miễn phí vận chuyển với đơn hàng 10 triệu)
                    </p>

                    <p class="shipping-info">
                        Thông tin vận chuyển: Sản phẩm sẽ được Hoàng Hoàn giao
                        trong vòng 2-7 ngày
                    </p>

                    <hr />

                    <div class="summary-row total">
                        <span>Tổng tiền</span>
                        <span id="total">0 VND</span>
                    </div>

                    <div class="summary-button">
                        <button id="checkout">Đặt hàng ngay</button>
                        <button id="continue-shopping">
                            Tiếp tục mua hàng
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>

        <script src="./JS/main.js"></script>
