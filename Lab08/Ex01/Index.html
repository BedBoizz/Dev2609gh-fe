<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Lab - JQuery</title>

        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <div class="container">
            <!-- KHU VỰC DANH SÁCH SINH VIÊN -->
            <div class="student-list">
                <h1>QUẢN LÝ SINH VIÊN</h1>
                <div class="toolbar">
                    <button type="button" id="btnAdd">
                        Thêm mới sinh viên
                    </button>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search Here"
                    />

                    <button type="button" id="btnSearch">Tìm kiếm</button>

                    <select id="sortAge">
                        <option value="">Sắp xếp</option>
                        <option value="asc">Tuổi tăng dần</option>
                        <option value="desc">Tuổi giảm dần</option>
                    </select>
                </div>

                <div class="table-card">
                    <h3>Danh Sách Sinh Viên</h3>

                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Mã sinh viên</th>
                                    <th>Tên sinh viên</th>
                                    <th>Tuổi</th>
                                    <th>Giới tính</th>
                                    <th>Hành động</th>
                                </tr>
                            </thead>

                            <tbody id="studentTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- KHU VỰC FORM THÔNG TIN -->
            <div class="student-form">
                <div class="form-card">
                    <h3>Thông Tin Sinh Viên</h3>

                    <form id="studentForm">
                        <div class="form-group">
                            <label for="studentId">Mã sinh viên</label>

                            <input type="text" id="studentId" />
                        </div>

                        <div class="form-group">
                            <label for="studentName">Tên sinh viên</label>

                            <input type="text" id="studentName" />
                        </div>

                        <div class="form-group">
                            <label for="age">Tuổi</label>

                            <input type="number" id="age" placeholder="0" />
                        </div>

                        <div class="form-group">
                            <label for="sex">Giới tính</label>

                            <select id="sex">
                                <option value="true">Nam</option>
                                <option value="false">Nữ</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="birthDate">Ngày sinh</label>

                            <input type="date" id="birthDate" />
                        </div>

                        <div class="form-group">
                            <label for="birthPlace">Nơi sinh</label>

                            <input
                                type="text"
                                id="birthPlace"
                                placeholder="Hà Nội"
                            />
                        </div>

                        <div class="form-group">
                            <label for="address">Địa chỉ</label>

                            <input type="text" id="address" />
                        </div>

                        <button type="submit" class="btn-save">Save</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- JQUERY -->
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

        <!-- JAVASCRIPT -->
        <script src="js/main.js"></script>
    </body>
</html>
