<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .khung{
            width: 600px;
            height: 300px;
            border: 1px solid;
        }

        .content{
            display: block;
            text-align: center;
        }

        ul li{
            display: inline-block;
            width: 150px;
            height: 100px;
            margin-right: 20px;
            background-color: aquamarine;
        }

        .content3{
            display: none;
        }
    </style>
</head>
<body>
    <div class="khung">
        <div class="content">San phẩm </div>

        <ul>
            <li>sản phảm 1</li>
            <li>sản phảm 2</li>
            <li>sản phảm 3</li>
        </ul>

        <div class="content3">sản phẩm 4</div>
    </div>
</body>
</html>
