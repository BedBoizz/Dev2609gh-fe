<body>
    <script>
        let diem = Number(prompt("Nhập điểm:"));

        if (diem > 9) {
            alert("Xuất xắc");
        } else if (diem >= 7) {
            alert("Khá");
        } else if (diem >= 5) {
            alert("trung bình")
        } else {
            alert("Yếu");
        }

    </script>
</body>
