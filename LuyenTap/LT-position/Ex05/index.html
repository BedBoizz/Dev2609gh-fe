<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
            width: 400px;
            height: 400px;
            position: relative;
            border: 1px solid;
        }
        img{
            width: 100%;
        }

        .sale{
            position: absolute;
            right: 20px;
            top: 20px;
            background-color: red;
            color: white;
            padding: 10px ;
            border: 2px solid black;
            border-radius: 10px;
        }

        .vga{
            position: absolute;
            left: 30px;
            bottom: 100px;
            background-color: aquamarine;
            padding: 10px 10px;
            border: 1px solid;
            border-radius: 10px;
        }

        .price{
            position: absolute;
            bottom: 5px;
            left: 5px;

        }

        button{
            position: absolute;
            right: 5px;
            bottom: 5px;
        }
    </style>

</head>
<body>
    <div class="card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQG1MjG6D_3OCo2yGAvP3VTcOpINvpssRID-brO3fo1xQ&s=10" alt="">

        <div class="sale">Sale</div>
        <div class="price">25.000.000đ</div>
        <div class="vga">RTX 3070</div>
        <button>MUA NGAY</button>
    </div>
</body>
</html>
