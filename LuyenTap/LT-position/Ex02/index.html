<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 400px;
            height: 300px;
            border: 1px solid ;
            position: relative;
        }

        .sanpham{
            position: absolute;
            top: 100px;
            left: 60px;
        }


        .sale{
            position: absolute;
            top: 10px;
            right: 10px;
        }

        .daucong{
            position: absolute;
            bottom: 10px;
            right: 10px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="sanpham">Sản phẩm</div>
        <div class="sale">Sale</div>
        <div class="daucong">+</div>
        
    </div>
</body>
</html>
