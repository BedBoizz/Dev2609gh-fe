<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
            width: 600px;
            height: 400px;
            border: 1px solid;
            position: relative;
        }

        img{
            position: absolute;
            width: 100%;
        }

        p{
            position: absolute;
            left: 20px;
            padding: 20px;
            background-color: brown;
            color: white;


        }

        .sale{
            position: absolute;
            right: 20px;
            padding: 20px;
            background-color: brown;
            color: white;
        }

        .plus{
            position: absolute;
            right: 20px;
            bottom: 20px;
            padding: 20px;
            background-color: brown;
            color: white;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://vcdn1-kinhdoanh.vnecdn.net/2026/04/07/image001-1775525738-8128-1775527482.jpg?w=500&h=300&q=100&dpr=1&fit=crop&s=tvFuI-RSBD0lukiZuVyyTw" alt="">
        <p>sản phẩm</p>
        <div class="sale">sale</div>
        <div class="plus">+</div>
    </div>
</body>
</html>
