<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .btn{
            background-color: blue;
            color: white;
            padding: 8px 16px;
        }

        .btn--large{
            padding: 12px 24px;
            font-size: 18px;
        }

        .btn--disabled{
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="button-group">
        <button class="btn">nút thường</button>
        <button class="btn btn--large">Nút to</button>
        <button class="btn btn--disabled" disabled>Nút khóa</button>
    </div>
</body>
</html>
