<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .alert{
            display: flex;
            align-items: center;
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .alert__content{
            margin: 0 16px;
            flex: 1;
        }
        .alert--success{
            background-color: rgba(0, 128, 0, 0.64);
        }

        .alert--error{
            background-color: rgba(255, 0, 0, 0.582);
        }

        .alert--warning{
            background-color: rgba(255, 255, 0, 0.62);
        }

        .btn{  
            background-color: blue;
            color: white;
            padding: 8px 16px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="alert alert--success">
        <img class="alert__icon" src="" alt="">
        <p class="alert__content">Nội dung</p>
        <button class="btn alert__close">x</button>
    </div>

    <div class="alert alert--error">
        <img class="alert__icon" src="" alt="">
        <p class="alert__content">Nội dung</p>
        <button class="btn alert__close">x</button>
    </div>

    <div class="alert alert--warning">
        <img class="alert__icon" src="" alt="">
        <p class="alert__content">Nội dung</p>
        <button class="btn alert__close">x</button>
    </div>
</body>
</html>
