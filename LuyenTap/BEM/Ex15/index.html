<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style15.css">
</head>
<body>
    <div class="pricing">

        <!-- Gói cơ bản -->
        <div class="pricing-card">
            <h3 class="pricing-card__name">Cơ bản</h3>
            <p class="pricing-card__price">99.000đ/Tháng</p>
            <ul class="pricing-card__list">
                <li class="pricing-card__feature">tính năng 1</li>
            </ul>
            <button class="btn pricing-card__btn">Chọn gói</button>
        </div>

        <!-- Gói phổ biến -->
        <div class="pricing-card pricing-card--featured">
            <h3 class="pricing-card__name">Phổ biến</h3>
            <p class="pricing-card__price">299.000đ/Tháng</p>
            <ul class="pricing-card__list">
                <li class="pricing-card__feature">tính năng 1</li>
            </ul>
            <button class="btn pricing-card__btn">Chọn gói</button>
        </div>

        <!-- Gói cao cấp -->
        <div class="pricing-card">
            <h3 class="pricing-card__name">Cao cấp</h3>
            <p class="pricing-card__price">499.000đ/Tháng</p>
            <ul class="pricing-card__list">
                <li class="pricing-card__feature">tính năng 1</li>
            </ul>
            <button class="btn pricing-card__btn">Chọn gói</button>
        </div>


    </div>
</body>
</html>
