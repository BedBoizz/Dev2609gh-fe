<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = Number(prompt("Nhập 1 số:"));

        if (a > 0) {
            alert("Số dương")
        } else if (a < 0) {
            alert("Số âm")
        } else {
            alert("Số 0")
        }
    </script>
</body>
</html>
