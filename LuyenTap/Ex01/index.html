<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">

        <div>
            <label for="name">Tài Khoản</label>
            <input type="text" name="name" id="name" required placeholder="Nguyễn Văn A" size="25">
        </div>
        
        <div>
            <label for="pass">Mật khẩu</label>
            <input type="password" name="pass" id="pass"
            required size="25" minlength="8">
        </div>

        <div>
            <input type="radio">Nam
            <input type="radio">Nữ
            <input type="radio">Khác
        </div>

        <div>
            <select name="option" id="option">
                <option value="">Thành viên bạc</option>
                <option value="">Thành viên vàng</option>
                <option value="">Thành viên kim cương</option>
            </select>

            <input type="color">
        </div>

        <div>
            <input type="checkbox">Nhớ đăng nhập
        </div>
        
        <div>
            <input type="submit">
            <input type="reset">
        </div>

    </form>
</body>
</html>
