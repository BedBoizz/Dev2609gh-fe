<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section>
        <h1>Thao tác CSS với Dom</h1>
        <div>
            <button onclick="changeStyle()">style</button>
            <button onclick="addClass()" id="btnAddClass">classList.add</button>
            <button onclick="removeClass()">classList.remove</button>
            <button onclick="toggleClass()" id="btnToggle">classList.    toggle()</button>
        </div>
    </section>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        h1{
            text-align: center;
        }

        section{
            margin: 1rem auto;
            padding: 1 rem;
            width: 500px;
            border: 1px solid black;
            border-radius: 10px;
        }

        div{
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        button{
            display: block;
            padding: 1rem 2rem;
            cursor: pointer;
        }

        .active{
            background-color: yellow;
            color: green;
            font-size: 2rem;
        }

        .toggle{
            background-color: red;
            color: #fff;
            border: none;
            font-size: 2rem;
        }
    </style>

    <script>
        const changeStyle = ()=>{
            document.querySelector("section").style.backgroundColor="green";
            document.querySelector("section").style.color="yellow";
        }

        const addClass = ()=>{
            document.getElementById("btnAddClass").classList.add("active");
        }

        const removeClass = ()=>{
            document.getElementById("btnAddClass").classList.remove("active")
        }

        const toggleClass = ()=>{
            document.getElementById("btnToggle").classList.toggle("toggle")
        }
    </script>
</body>
</html>
