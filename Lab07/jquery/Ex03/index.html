<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <script src="./jquery-4.0.0.min.js"></script>
        <script>
            jQuery(document).ready(function ($) {
                $("a>img").click(function (event) {
                    img = $(this).attr("src");
                    $("#image > img").attr({
                        src: img,
                    });
                    $("a>img").removeClass("actived");
                    $(this).addClass("actived");
                });
            });
        </script>
    </head>
    <body>
        <div id="main">
            <div id="image">
                <img src="image/images (1).jpg" alt="" />
            </div>
            <div id="thum">
                <ul>
                    <li>
                        <a href="javascript:void(0)">
                            <img src="image/images (2).jpg" alt="" />
                        </a>
                    </li>
                    <li>
                        <a href="javascript:void(0)">
                            <img src="image/images (3).jpg" alt="" />
                        </a>
                    </li>
                    <li>
                        <a href="javascript:void(0)">
                            <img src="image/images (4).jpg" alt="" />
                        </a>
                    </li>
                    <li>
                        <a href="javascript:void(0)">
                            <img src="image/images (5).jpg" alt="" />
                        </a>
                    </li>
                    <li>
                        <a href="javascript:void(0)">
                            <img src="image/images (6).jpg" alt="" />
                        </a>
                    </li>
                    <li>
                        <a href="javascript:void(0)">
                            <img src="image/images (7).jpg" alt="" />
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <style>
            #main {
                width: 670px;
                height: 446px;
                margin: 0 auto;
            }

            #thum ul {
                list-style: none;
                padding: 0;
                margin: 0;
            }

            #thum ul li {
                float: left;
                margin-right: 2px;
            }

            #thum ul li a img {
                width: 105px;
                border: solid 2px #ccc;
            }

            .actived {
                border: solid 4px red o !important;
            }
        </style>
    </body>
</html>
