<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>
    <table width="500" border="1" cellpadding="10" >
        <caption>Tiêu đề bảng</caption>
        <thead>
            <tr >
                <th>Cột 1</th> <th>Cột 2</th>
                <Th>Cột 3</Th> <th>Cột 4</th>
                <th>Cột 5</th> <th>Cột 6</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="2"> Cột 1 </th> <th>Cột 2</th>
                <Th>Cột 3</Th> <th>Cột 4</th>
                <th>Cột 5</th> <th>Cột 6</th>
            </tr>
            <tr>
                <th>Cột 2</th> <th>Cột 3</th>
                <Th>Cột 4</Th> <th>Cột 5</th>
                <th>Cột 6</th> 
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="5">Cột 5</td>
                <td> Cột 6 </td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
