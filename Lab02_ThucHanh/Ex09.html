<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="post">
        <table border="0" cellpadding="5" cellspacing="0" width="400" align="center">
            <thead>
                <tr>
                    <th colspan="2" align="left">
                    <h1>Thông tin đăng ký</h1>
                    </th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>
                        <label for="name">Họ và tên</label>
                    </td>
                    <td>
                        <input type="name" name="name" id="name" required value="Nguyễn Phượng Hoàng" size="25">
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="name">Tên đăng nhập</label>
                    </td>
                    <td>
                        <input type="name" name="name"  id="name" required value="nqhoang" size="25">
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="pass">Mật khẩu</label>
                    </td>
                    <td>
                        <input type="password" name="pass" id="pass" required value="........." size="20">   
                    </td>
                </tr>

                <tr>
                    <td>Giới tính</td>
                    <td>
                        <input type="radio" name="Gioitinh" id="nam" value="Nam">
                        <label for="Nam">Nam</label>

                        <input type="radio" name="Gioitinh" id="nu" value="Nữ">
                        <label for="nu">Nữ</label>
                    </td>
                </tr>

                <tr>
                    <td>Ngôn ngữ lập trình</td>
                    <td>
                        <input type="checkbox" name="" id="">Ngôn ngữ C#
                        <br>
                        <input type="checkbox" name="" id="">Ngôn ngữ Java
                        <br>
                        <input type="checkbox" name="" id="">Ngôn ngữ PHP
                        <br>
                        <input type="checkbox" name="" id="">Ngôn ngữ khác
                    </td>
                </tr>

                <tr>
                    <td>Tỉnh thành</td>
                    <td>
                        <select name="tinhthanh" id="tinhthanh">
                            <option value="">Hà Nôi</option>
                            <option value="">Hồ Chí Minh</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td></td>
                    <td align="r">
                        <input type="submit" value="Đăng ký">
                        <input type="reset">
                    </td>
                </tr>


            </tbody>
        </table>
    </form>
</body>
</html>
