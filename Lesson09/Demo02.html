<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2 id="title">Ví dụ Dom Event</h2>
    <!-- Click Event -->
    <button id="btnClick">Click me</button>
    <br><br>
    <p id="hoverText">Di chuột vào đây</p>
    <br>
    <!-- Keyboard Event -->
    <input type="text" id="nameInput" placeholder="Nhập tên của bạn vào đây">
    <p id="result"></p>
    <!-- Change Event -->
    <select id="colorSelect">
        <option value="">Chọn màu</option>
        <option value="Red">Đỏ</option>
        <option value="Blue">Xanh </option>
        <option value="Green">Lá</option>
    </select>

    <script src=""></script>
</body>
</html>
